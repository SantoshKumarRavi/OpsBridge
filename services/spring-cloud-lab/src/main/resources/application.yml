server:
  port: ${PORT:8014}
spring:
  application:
    name: opsbridge-spring-cloud-lab
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      screening-provider:
        sliding-window-type: count-based
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
demo:
  dependency-url: ${DEMO_DEPENDENCY_URL:http://localhost:8014/v1/resilience/dependency}
  simulate-failure: ${DEMO_SIMULATE_FAILURE:false}
