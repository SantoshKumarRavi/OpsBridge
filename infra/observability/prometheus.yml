global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
  - job_name: gateway
    metrics_path: /metrics
    static_configs: [{ targets: ['api-gateway:8080'] }]
  - job_name: spring-integrations
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['integration-service:8083'] }]
  - job_name: telemetry
    metrics_path: /metrics
    static_configs: [{ targets: ['telemetry-service:8090'] }]
  - job_name: ai-runtime
    metrics_path: /metrics
    static_configs: [{ targets: ['ai-runtime:8002'] }]
