apiVersion: v1
kind: ConfigMap
metadata:
  name: opsbridge-config
data:
  APP_ENV: production
  COMPLIANCE_SERVICE_URL: http://compliance-api:8001
  AI_SERVICE_URL: http://ai-runtime:8002
  INTEGRATION_SERVICE_URL: http://integration-service:8083
  TELEMETRY_SERVICE_URL: http://telemetry-service:8090
  DEV_IDENTITY_ENABLED: "false"
  USE_S3: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api-gateway
          image: ghcr.io/REPLACE/opsbridge-api-gateway:REPLACE
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: opsbridge-config } }, { secretRef: { name: opsbridge-secrets } }]
          env:
            - name: RATE_LIMIT_REDIS_URL
              valueFrom: { secretKeyRef: { name: opsbridge-secrets, key: RATE_LIMIT_REDIS_URL } }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway }
spec:
  selector: { app: api-gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: compliance-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: compliance-api } }
  template:
    metadata: { labels: { app: compliance-api } }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: compliance-api
          image: ghcr.io/REPLACE/opsbridge-compliance-api:REPLACE
          ports: [{ name: http, containerPort: 8001 }]
          envFrom: [{ configMapRef: { name: opsbridge-config } }, { secretRef: { name: opsbridge-secrets } }]
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: compliance-api }
spec:
  selector: { app: compliance-api }
  ports: [{ name: http, port: 8001, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-runtime }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-runtime } }
  template:
    metadata: { labels: { app: ai-runtime } }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ai-runtime
          image: ghcr.io/REPLACE/opsbridge-ai-runtime:REPLACE
          ports: [{ name: http, containerPort: 8002 }]
          envFrom: [{ configMapRef: { name: opsbridge-config } }, { secretRef: { name: opsbridge-secrets } }]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: ai-runtime }
spec:
  selector: { app: ai-runtime }
  ports: [{ name: http, port: 8002, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api-gateway }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
