name: opsbridge
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_DB: opsbridge, POSTGRES_USER: opsbridge, POSTGRES_PASSWORD: opsbridge }
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U opsbridge"], interval: 5s, timeout: 3s, retries: 20 }
  mongo:
    image: mongo:8
    profiles: ["data-labs"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  mysql:
    image: mysql:8.4
    profiles: ["data-labs"]
    environment: { MYSQL_DATABASE: opsbridge, MYSQL_USER: opsbridge, MYSQL_PASSWORD: opsbridge, MYSQL_ROOT_PASSWORD: local-root-only }
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
  dynamodb:
    image: amazon/dynamodb-local:latest
    profiles: ["data-labs"]
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]
  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["oracle-lab"]
    environment: { ORACLE_PASSWORD: local-only-password }
    ports: ["1521:1521"]
    volumes: ["oracle-data:/opt/oracle/oradata"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: opsbridge, RABBITMQ_DEFAULT_PASS: opsbridge }
    ports: ["5672:5672", "15672:15672"]
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["29092:29092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
  nats:
    image: nats:2-alpine
    profiles: ["messaging-labs"]
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    profiles: ["search-labs"]
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["9200:9200"]
    volumes: ["elastic-data:/usr/share/elasticsearch/data"]
  neo4j:
    image: neo4j:5-community
    profiles: ["graph-labs"]
    environment: { NEO4J_AUTH: neo4j/local-only-password }
    ports: ["7474:7474", "7687:7687"]
  memgraph:
    image: memgraph/memgraph:latest
    profiles: ["graph-labs"]
    ports: ["7688:7687", "7444:7444"]
  localstack:
    image: localstack/localstack:4
    profiles: ["aws-labs"]
    environment: { SERVICES: s3,sqs,sns,dynamodb,lambda,cloudwatch,secretsmanager,stepfunctions,glue,apigateway,iam,sts,logs,events,cloudformation,route53,cloudfront,ecs,ecr,eks,ec2,cdk,DEFAULT_REGION: ap-south-1 }
    ports: ["4566:4566"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "localstack-data:/var/lib/localstack"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    profiles: ["identity"]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-only-password}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes: ["./keycloak/opsbridge-realm.json:/opt/keycloak/data/import/opsbridge-realm.json:ro"]
  compliance-api:
    build: ../services/compliance-api
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: development
      OTEL_SERVICE_NAME: opsbridge-compliance-api
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      POSTGRES_HOST: postgres
      POSTGRES_DB: opsbridge
      POSTGRES_USER: opsbridge
      POSTGRES_PASSWORD: opsbridge
      RABBITMQ_URL: amqp://opsbridge:opsbridge@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_SERVICE_URL: http://ai-runtime:8002
      DEV_IDENTITY_ENABLED: ${DEV_IDENTITY_ENABLED:-true}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/opsbridge}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/opsbridge/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-opsbridge-api}
      MEDIA_ROOT: /data/uploads
      REALTIME_SERVICE_URL: http://realtime-service:8091
    ports: ["8001:8001"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_started }
      otel-collector: { condition: service_started }
  celery-worker:
    build: ../services/compliance-api
    env_file:
      - path: ../.env
        required: false
    command: ["opentelemetry-instrument", "celery", "-A", "config", "worker", "-l", "INFO", "--concurrency=2"]
    environment:
      APP_ENV: development
      OTEL_SERVICE_NAME: opsbridge-celery-worker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      POSTGRES_HOST: postgres
      POSTGRES_DB: opsbridge
      POSTGRES_USER: opsbridge
      POSTGRES_PASSWORD: opsbridge
      RABBITMQ_URL: amqp://opsbridge:opsbridge@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_SERVICE_URL: http://ai-runtime:8002
      REALTIME_SERVICE_URL: http://realtime-service:8091
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      MEDIA_ROOT: /data/uploads
    volumes: ["uploads:/data/uploads"]
    depends_on: [compliance-api, rabbitmq, redis, otel-collector]
  celery-beat:
    build: ../services/compliance-api
    env_file:
      - path: ../.env
        required: false
    command: ["opentelemetry-instrument", "celery", "-A", "config", "beat", "-l", "INFO"]
    environment:
      APP_ENV: development
      OTEL_SERVICE_NAME: opsbridge-celery-beat
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      POSTGRES_HOST: postgres
      POSTGRES_DB: opsbridge
      POSTGRES_USER: opsbridge
      POSTGRES_PASSWORD: opsbridge
      RABBITMQ_URL: amqp://opsbridge:opsbridge@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_SERVICE_URL: http://ai-runtime:8002
      REALTIME_SERVICE_URL: http://realtime-service:8091
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      MEDIA_ROOT: /data/uploads
    volumes: ["uploads:/data/uploads"]
    depends_on: [compliance-api, rabbitmq, redis, kafka, otel-collector]
  ai-runtime:
    build:
      context: ../services/ai-runtime
      args:
        INSTALL_RERANKER: ${AI_INSTALL_RERANKER:-false}
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: 8002
      POSTGRES_HOST: postgres
      POSTGRES_DB: opsbridge
      POSTGRES_USER: opsbridge
      POSTGRES_PASSWORD: opsbridge
      AGENT_MEMORY_BACKEND: postgres
      AGENT_MEMORY_TTL_DAYS: ${AGENT_MEMORY_TTL_DAYS:-30}
      AGENT_MEMORY_CLEANUP_INTERVAL_SECONDS: ${AGENT_MEMORY_CLEANUP_INTERVAL_SECONDS:-3600}
      LANGGRAPH_STRICT_MSGPACK: "true"
      COMPLIANCE_API_BASE_URL: http://compliance-api:8001
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      RAG_RERANKER_DEVICE: ${RAG_RERANKER_DEVICE:-cpu}
      OTEL_SERVICE_NAME: opsbridge-ai-runtime
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports: ["8002:8002"]
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
  ai-provider-evaluation:
    build: ../services/ai-runtime
    env_file:
      - path: ../.env
        required: false
    environment:
      LLM_COST_PER_1K_INPUT_USD: ${LLM_COST_PER_1K_INPUT_USD:-0}
      LLM_COST_PER_1K_OUTPUT_USD: ${LLM_COST_PER_1K_OUTPUT_USD:-0}
    volumes: ["../artifacts:/artifacts"]
    command: ["python", "/app/evals/provider_reliability.py", "--output", "/artifacts/ai-provider-reliability.json"]
    profiles: ["ai-evaluation"]
  integration-lab:
    build: ../services/integration-lab
    environment:
      PORT: 8004
      MONGODB_URL: mongodb://mongo:27017/opsbridge
      MYSQL_URL: mysql+pymysql://opsbridge:opsbridge@mysql:3306/opsbridge
      REDIS_URL: redis://redis:6379/2
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      MEMGRAPH_URI: bolt://memgraph:7687
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ap-south-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://opsbridge:opsbridge@rabbitmq:5672/
      NATS_URL: nats://nats:4222
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
    profiles: ["data-labs", "messaging-labs", "search-labs", "graph-labs", "oracle-lab"]
    ports: ["8004:8004"]
  integration-service:
    build: ../services/integration-service
    env_file:
      - path: ../.env
        required: false
    environment: { PORT: 8083, KAFKA_BOOTSTRAP_SERVERS: kafka:9092, COMPLIANCE_API_BASE_URL: http://compliance-api:8001, INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-local-internal-token}" }
    ports: ["8083:8083"]
  telemetry-service:
    build: ../services/telemetry-service
    environment: { PORT: 8090 }
    ports: ["8090:8090"]
  webhook-gateway:
    build: ../services/webhook-gateway
    env_file:
      - path: ../.env
        required: false
    environment: { PORT: 8787, KAFKA_BOOTSTRAP_SERVERS: kafka:9092 }
    ports: ["8787:8787"]
    depends_on: [kafka]
  api-gateway:
    build: ../services/api-gateway
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: 8080
      APP_ENV: development
      OTEL_SERVICE_NAME: opsbridge-api-gateway
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEV_IDENTITY_ENABLED: ${DEV_IDENTITY_ENABLED:-true}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/4}
      COMPLIANCE_SERVICE_URL: http://compliance-api:8001
      AI_SERVICE_URL: http://ai-runtime:8002
      INTEGRATION_SERVICE_URL: http://integration-service:8083
      TELEMETRY_SERVICE_URL: http://telemetry-service:8090
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:-local-realtime-ticket-secret-change-me}
      REALTIME_WS_URL: ws://localhost:8091/ws/cases
    ports: ["8080:8080"]
    depends_on:
      compliance-api: { condition: service_started }
      ai-runtime: { condition: service_started }
      integration-service: { condition: service_started }
      otel-collector: { condition: service_started }
      redis: { condition: service_healthy }
  realtime-service:
    build: ../services/realtime-service
    environment:
      APP_ENV: development
      PORT: 8091
      REDIS_URL: redis://redis:6379/3
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:-local-realtime-ticket-secret-change-me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:4200,http://localhost:4173,http://localhost:4301
    ports: ["8091:8091"]
    depends_on: [redis]
  graphql-bff:
    build: ../services/graphql-bff
    environment:
      PORT: 8010
      API_GATEWAY_URL: http://api-gateway:8080/api/v1
    ports: ["8010:8010"]
    depends_on: [api-gateway]
  spring-data-lab:
    build: ../services/spring-data-lab
    environment: { PORT: 8012 }
    ports: ["8012:8012"]
  spring-cloud-lab:
    build: ../services/spring-cloud-lab
    environment: { PORT: 8014, DEMO_SIMULATE_FAILURE: "${DEMO_SIMULATE_FAILURE:-false}" }
    ports: ["8014:8014"]
    profiles: ["spring-cloud-labs"]
  event-consumer:
    build:
      context: ..
      dockerfile: services/event-consumer/Dockerfile
    environment:
      PORT: 8092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://opsbridge:opsbridge@postgres:5432/opsbridge
      KAFKA_GROUP_ID: opsbridge-case-projection-v1
    ports: ["8092:8092"]
    profiles: ["event-consumer-lab"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
  agent-framework-lab:
    build: ../services/agent-framework-lab
    env_file:
      - path: ../.env
        required: false
    environment: { PORT: 8013 }
    ports: ["8013:8013"]
    profiles: ["agent-labs"]
  frontend-deps:
    image: node:22-alpine
    working_dir: /workspace
    command: ["npm", "install"]
    volumes: ["../:/workspace", "workspace-node-modules:/workspace/node_modules"]
    profiles: ["apps"]
  operations-dashboard:
    image: node:22-alpine
    working_dir: /workspace
    command: ["npm", "--workspace", "apps/operations-dashboard", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes: ["../:/workspace", "workspace-node-modules:/workspace/node_modules"]
    environment: { VITE_API_URL: http://localhost:8080/api/v1, VITE_KEYCLOAK_URL: "${VITE_KEYCLOAK_URL:-}" }
    ports: ["5173:5173"]
    profiles: ["apps"]
    depends_on: { frontend-deps: { condition: service_completed_successfully } }
  worker-portal:
    image: node:22-alpine
    working_dir: /workspace
    command: ["npm", "--workspace", "apps/worker-portal", "run", "dev"]
    volumes: ["../:/workspace", "workspace-node-modules:/workspace/node_modules"]
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1, NEXT_PUBLIC_KEYCLOAK_URL: "${KEYCLOAK_PUBLIC_URL:-}" }
    ports: ["3000:3000"]
    profiles: ["apps"]
    depends_on: { frontend-deps: { condition: service_completed_successfully } }
  compliance-console:
    image: node:22-alpine
    working_dir: /workspace
    command: ["npm", "--workspace", "apps/compliance-console", "run", "start"]
    volumes: ["../:/workspace", "workspace-node-modules:/workspace/node_modules"]
    ports: ["4200:4200"]
    profiles: ["apps"]
    depends_on: { frontend-deps: { condition: service_completed_successfully } }
  integration-console:
    image: node:22-alpine
    working_dir: /workspace
    command: ["npm", "--workspace", "apps/integration-console", "run", "dev", "--", "--host", "0.0.0.0", "--port", "4173"]
    volumes: ["../:/workspace", "workspace-node-modules:/workspace/node_modules"]
    environment: { VITE_API_URL: http://localhost:8080/api/v1, VITE_KEYCLOAK_URL: "${VITE_KEYCLOAK_URL:-}" }
    ports: ["4173:4173"]
    profiles: ["apps"]
    depends_on: { frontend-deps: { condition: service_completed_successfully } }
  frontend-patterns:
    image: node:22-alpine
    working_dir: /workspace
    command: ["npm", "--workspace", "apps/frontend-patterns", "run", "dev", "--", "--host", "0.0.0.0", "--port", "4301"]
    volumes: ["../:/workspace", "workspace-node-modules:/workspace/node_modules"]
    ports: ["4301:4301"]
    profiles: ["apps"]
    depends_on: { frontend-deps: { condition: service_completed_successfully } }
  careers-site:
    image: node:22-alpine
    working_dir: /workspace
    command: ["npm", "--workspace", "apps/careers-site", "run", "dev", "--", "--hostname", "0.0.0.0"]
    volumes: ["../:/workspace", "workspace-node-modules:/workspace/node_modules"]
    ports: ["3002:3002"]
    profiles: ["apps"]
    depends_on: { frontend-deps: { condition: service_completed_successfully } }
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=45d"]
    volumes:
      - "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./observability/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "./observability/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro"
      - "prometheus-data:/prometheus"
    ports: ["9090:9090"]
    depends_on: [alertmanager]
  alertmanager:
    image: prom/alertmanager:v0.35.0
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes: ["./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
    depends_on: [mailpit]
  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: ["observability"]
    ports: ["8025:8025"]
  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    volumes:
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["3001:3000"]
    depends_on: [prometheus]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
volumes:
  prometheus-data: {}
  postgres-data: {}
  mongo-data: {}
  mysql-data: {}
  oracle-data: {}
  redis-data: {}
  kafka-data: {}
  elastic-data: {}
  workspace-node-modules: {}
  localstack-data: {}
  uploads: {}
